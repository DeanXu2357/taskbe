openapi: 3.0.3
info:
  title: Task API
  version: 1.0.0
  description: |
    RESTful API for managing tasks. Data is kept in memory and is lost when
    the server restarts.

    Every response except 204 has `Content-Type: application/json`.
    Unknown fields in request bodies are ignored. Request bodies larger than
    1 MiB are rejected with 413. A method that a path does not support
    returns 405 with an `Allow` header and the `method_not_allowed` error
    code. An unknown path returns 404 with the `not_found` error code.
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: tasks
    description: Create, list, get, replace and delete tasks.
paths:
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks
      description: |
        Returns tasks ordered by ascending id. Without `cursor` and `limit`,
        it returns the first 20 tasks, starting from the smallest id.
        Without `cursor`, the page starts from the first task; without
        `limit`, the page holds at most 20 tasks. Pagination is keyset-based:
        pass the `next_cursor` of the previous page as `cursor` to get the
        next page. A cursor stays valid even if the task it points at has
        been deleted. `next_cursor` is null on the last page.
      parameters:
        - name: limit
          in: query
          description: Maximum number of tasks to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor taken from `next_cursor` of the previous page.
          schema:
            type: string
          example: eyJhZnRlcl9pZCI6Mn0
      responses:
        "200":
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
              examples:
                firstPage:
                  value:
                    data:
                      - id: 1
                        name: 買早餐
                        status: 0
                        version: 1
                        created_at: "2026-11-17T08:00:00Z"
                        updated_at: "2026-11-17T08:00:00Z"
                      - id: 2
                        name: 買午餐
                        status: 1
                        version: 2
                        created_at: "2026-11-17T08:05:00Z"
                        updated_at: "2026-11-17T09:00:00Z"
                    next_cursor: eyJhZnRlcl9pZCI6Mn0
                empty:
                  value:
                    data: []
                    next_cursor: null
        "400":
          description: "`limit` is not an integer or is out of range, or `cursor` is invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: "invalid query parameter: limit is out of range (must be between 1 and 100)"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            example:
              name: 買早餐
      responses:
        "201":
          description: The task was created.
          headers:
            Location:
              description: Path of the new task.
              schema:
                type: string
              example: /tasks/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
              example:
                data:
                  id: 1
                  name: 買早餐
                  status: 0
                  version: 1
                  created_at: "2026-11-17T08:00:00Z"
                  updated_at: "2026-11-17T08:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          Task id as a canonical positive decimal integer. Forms such as
          `01`, `+1`, `0` or values beyond int64 return 404.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get a task
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [tasks]
      operationId: replaceTask
      summary: Replace a task
      description: |
        Replaces the whole task, so `name` and `status` are both required.
        `version` must be the version the client last read; if the task has
        been changed since, the request fails with 409 and nothing is
        written. On success `version` increases by 1, `created_at` is kept
        and `updated_at` is set to the current time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceTaskRequest"
            example:
              name: 買午餐
              status: 1
              version: 1
      responses:
        "200":
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
              example:
                data:
                  id: 1
                  name: 買午餐
                  status: 1
                  version: 2
                  created_at: "2026-11-17T08:00:00Z"
                  updated_at: "2026-11-17T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task
      responses:
        "204":
          description: The task was deleted. The response has no body.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    TaskStatus:
      type: integer
      enum: [0, 1]
      description: 0 represents an incomplete task, 1 represents a completed task.
    TaskName:
      type: string
      minLength: 1
      maxLength: 200
      description: |
        Task name. Leading and trailing whitespace is removed before
        validation and storage; the result must be 1 to 200 characters.
    Task:
      type: object
      required: [id, name, status, version, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Assigned by the server, increasing, never reused.
        name:
          $ref: "#/components/schemas/TaskName"
        status:
          $ref: "#/components/schemas/TaskStatus"
        version:
          type: integer
          format: int64
          minimum: 1
          description: 1 when created, increased by 1 on every replace.
        created_at:
          type: string
          format: date-time
          description: Creation time in UTC.
        updated_at:
          type: string
          format: date-time
          description: Last update time in UTC.
    CreateTaskRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/TaskName"
        status:
          type: integer
          enum: [0, 1]
          default: 0
          description: Optional. Omitted means 0.
    ReplaceTaskRequest:
      type: object
      required: [name, status, version]
      properties:
        id:
          type: integer
          format: int64
          description: Optional. If present it must equal the id in the path.
        name:
          $ref: "#/components/schemas/TaskName"
        status:
          $ref: "#/components/schemas/TaskStatus"
        version:
          type: integer
          format: int64
          description: The version the client last read. It must equal the current version.
    TaskResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Task"
    TaskListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null on the last page.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_json
                - validation_failed
                - not_found
                - method_not_allowed
                - conflict
                - payload_too_large
                - internal_error
            message:
              type: string
  responses:
    BadRequest:
      description: |
        `invalid_json` when the body is empty, is not a JSON object, has a
        field of the wrong type or is not valid JSON. `validation_failed`
        when a field (including `version` on replace) is missing or has an
        invalid value, or when the body `id` does not match the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidJSON:
              value:
                error:
                  code: invalid_json
                  message: invalid value for field "status"
            validationFailed:
              value:
                error:
                  code: validation_failed
                  message: status must be 0 or 1
    NotFound:
      description: The task does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: task not found
    Conflict:
      description: The `version` in the request does not match the current version of the task.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conflict
              message: version does not match the current task
    PayloadTooLarge:
      description: The request body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: payload_too_large
              message: request body must not exceed 1 MiB
    InternalError:
      description: An unexpected error. Details are only written to the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: internal_error
              message: internal server error
